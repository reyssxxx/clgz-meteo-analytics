[project]
name = "meteo-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "plotly>=5.22",
  "openpyxl>=3.1",
  "requests>=2.32",
  "fastapi>=0.165.0",
  "uvicorn[standard]>=0.54.0",
  "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false
