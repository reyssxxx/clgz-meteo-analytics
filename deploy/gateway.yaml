openapi: "3.0.0"
info:
  title: meteo
  version: "1.0"
paths:
  /:
    x-yc-apigateway-any-method:
      parameters:
        - {name: Cookie, in: header, required: false, schema: {type: string}}
        - {name: Content-Type, in: header, required: false, schema: {type: string}}
      x-yc-apigateway-integration:
        type: http
        url: http://51.250.64.8/
        headers: {Cookie: "{Cookie}", Content-Type: "{Content-Type}"}
        query: {"*": "*"}
        timeouts: {connect: 5, read: 120}
  /{file+}:
    x-yc-apigateway-any-method:
      parameters:
        - {name: file, in: path, required: true, schema: {type: string}}
        - {name: Cookie, in: header, required: false, schema: {type: string}}
        - {name: Content-Type, in: header, required: false, schema: {type: string}}
      x-yc-apigateway-integration:
        type: http
        url: http://51.250.64.8/{file}
        headers: {Cookie: "{Cookie}", Content-Type: "{Content-Type}"}
        query: {"*": "*"}
        timeouts: {connect: 5, read: 120}
# HTTPS-адрес поверх ВМ (адрес *.apigw.yandexcloud.net открывается и в сетях, где закрыты нестандартные порты):
#   yc serverless api-gateway create --name meteo-gw --spec deploy/gateway.yaml
#   yc serverless api-gateway update meteo-gw --spec deploy/gateway.yaml
# После обновления спецификации настройки применяются на узлах шлюза не сразу, около минуты.
# IP ВМ в url выше нужно заменить, если ВМ создана заново.
